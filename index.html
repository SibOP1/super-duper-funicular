<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Free Chatbot 2026</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111827;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .chat{
      width:400px;
      height:600px;
      background:#1f2937;
      border-radius:12px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .top{
      background:#2563eb;
      color:white;
      padding:16px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .messages{
      flex:1;
      overflow-y:auto;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .msg{
      max-width:80%;
      padding:12px;
      border-radius:12px;
      color:white;
      line-height:1.5;
      white-space:pre-wrap;
      word-wrap:break-word;
    }

    .user{
      background:#2563eb;
      align-self:flex-end;
    }

    .bot{
      background:#374151;
      align-self:flex-start;
    }

    .bottom{
      display:flex;
      gap:10px;
      padding:10px;
      background:#111827;
      border-top:1px solid #374151;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    button{
      padding:12px 16px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:15px;
    }

    button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

<div class="chat">

  <div class="top">
    Gemini AI Chatbot
  </div>

  <div class="messages" id="messages"></div>

  <div class="bottom">
    <input
      type="text"
      id="input"
      placeholder="Type a message..."
    />

    <button onclick="sendMessage()">
      Send
    </button>
  </div>

</div>

<script>

  // =========================
  // PASTE YOUR API KEY HERE
  // =========================
  const API_KEY = "YOUR_API_KEY";

  // FREE MODEL (2026)
  const MODEL = "gemini-2.0-flash";

  const messages = document.getElementById("messages");
  const input = document.getElementById("input");

  // Store conversation history
  let chatHistory = [];

  function addMessage(text, type){

    const div = document.createElement("div");

    div.className = `msg ${type}`;

    div.innerText = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }

  async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    // Add user message
    addMessage(text, "user");

    // Save user message
    chatHistory.push({
      role: "user",
      parts: [{ text }]
    });

    input.value = "";

    // Loading message
    const loading = document.createElement("div");

    loading.className = "msg bot";

    loading.innerText = "Typing...";

    messages.appendChild(loading);

    messages.scrollTop = messages.scrollHeight;

    try{

      // 2026 Gemini API endpoint
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            contents: chatHistory,

            generationConfig: {
              temperature: 0.7,
              topK: 40,
              topP: 0.95,
              maxOutputTokens: 1024
            }

          })
        }
      );

      const data = await response.json();

      // Remove loading
      loading.remove();

      // Error handling
      if(!response.ok){

        addMessage(
          data.error?.message || "Request failed",
          "bot"
        );

        console.log(data);

        return;
      }

      // Get AI reply
      const reply =
        data.candidates?.[0]?.content?.parts?.[0]?.text
        || "No response.";

      // Add bot message
      addMessage(reply, "bot");

      // Save bot reply
      chatHistory.push({
        role: "model",
        parts: [{ text: reply }]
      });

    }catch(error){

      loading.remove();

      addMessage(
        "Error: " + error.message,
        "bot"
      );

      console.error(error);
    }
  }

  // ENTER key support
  input.addEventListener("keydown", (e) => {

    if(e.key === "Enter"){

      sendMessage();
    }
  });

</script>

</body>
</html>
