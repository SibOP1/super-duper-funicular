<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .chat-box { width: 100%; max-width: 500px; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        #output { height: 300px; overflow-y: auto; border-bottom: 1px solid #333; margin-bottom: 15px; padding: 10px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; outline: none; }
        button { padding: 10px 20px; background: #00ff88; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .user { color: #00aaff; margin-top: 10px; }
        .ai { color: #00ff88; margin-top: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="chat-box">
    <h3>OpenRouter - Ring 2.6</h3>
    <div id="output"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something...">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    async function callAI() {
        const prompt = userInput.value.trim();
        if (!prompt) return;

        output.innerHTML += `<div class="user"><b>You:</b> ${prompt}</div>`;
        userInput.value = '';
        sendBtn.disabled = true;

        const API_KEY = "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";
        const url = "https://openrouter.ai/api/v1/chat/completions";

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`,
                    "HTTP-Referer": window.location.origin,
                    "X-Title": "AI Chat Project"
                },
                body: JSON.stringify({
                    model: "inclusionai/ring-2.6-1t:free",
                    messages: [
                        { role: "user", content: prompt }
                    ]
                })
            });

            const data = await response.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            const aiResponse = data.choices[0].message.content;
            output.innerHTML += `<div class="ai"><b>AI:</b> ${aiResponse}</div>`;

        } catch (error) {
            output.innerHTML += `<div style="color:red"><b>Error:</b> ${error.message}</div>`;
            console.error(error);
        } finally {
            sendBtn.disabled = false;
            output.scrollTop = output.scrollHeight;
        }
    }

    sendBtn.onclick = callAI;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') callAI(); };
</script>

</body>
</html>
