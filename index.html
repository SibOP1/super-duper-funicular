<!DOCTYPE html>
<html>
<head>
  <title>Gemini Chatbot</title>
  <style>
    body{
      background:#111827;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .chat{
      width:400px;
      height:600px;
      background:#1f2937;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .top{
      background:#2563eb;
      color:white;
      padding:15px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .messages{
      flex:1;
      overflow:auto;
      padding:10px;
    }

    .msg{
      margin:10px 0;
      padding:10px;
      border-radius:10px;
      color:white;
      max-width:80%;
      white-space:pre-wrap;
    }

    .user{
      background:#2563eb;
      margin-left:auto;
    }

    .bot{
      background:#374151;
    }

    .bottom{
      display:flex;
      padding:10px;
      background:#111827;
    }

    input{
      flex:1;
      padding:10px;
      border:none;
      border-radius:8px;
      outline:none;
    }

    button{
      margin-left:10px;
      padding:10px 15px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="chat">

  <div class="top">
    Gemini Chat
  </div>

  <div class="messages" id="messages"></div>

  <div class="bottom">
    <input type="text" id="input" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

const API_KEY = "AIzaSyB1MeT1WfXzp5zOZZVYKc-oV2vdMxqaRus";

// WORKING FREE MODEL
const MODEL = "gemini-2.0-flash";

const messages = document.getElementById("messages");
const input = document.getElementById("input");

function addMessage(text,type){

  const div = document.createElement("div");

  div.className = `msg ${type}`;

  div.innerText = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value = "";

  addMessage("Typing...","bot");

  try{

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/${MODEL}:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          contents:[
            {
              parts:[
                {
                  text:text
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    // remove typing
    messages.removeChild(messages.lastChild);

    if(!response.ok){

      addMessage(
        data.error?.message || "Request failed",
        "bot"
      );

      console.log(data);

      return;
    }

    const reply =
      data.candidates?.[0]?.content?.parts?.[0]?.text
      || "No response";

    addMessage(reply,"bot");

  }catch(err){

    messages.removeChild(messages.lastChild);

    addMessage("Error: " + err.message,"bot");
  }
}

input.addEventListener("keypress",e=>{

  if(e.key==="Enter"){

    sendMessage();
  }
});

</script>

</body>
</html>
