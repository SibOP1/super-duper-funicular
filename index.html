<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Gemini Chatbot</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .chat-container{
      width:400px;
      height:600px;
      background:#1e293b;
      border-radius:12px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 0 20px rgba(0,0,0,0.4);
    }

    .header{
      background:#2563eb;
      color:white;
      padding:15px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .chat-box{
      flex:1;
      padding:15px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .message{
      padding:10px 14px;
      border-radius:10px;
      max-width:80%;
      color:white;
      line-height:1.4;
      white-space:pre-wrap;
    }

    .user{
      background:#2563eb;
      align-self:flex-end;
    }

    .bot{
      background:#334155;
      align-self:flex-start;
    }

    .input-area{
      display:flex;
      padding:10px;
      background:#111827;
    }

    .input-area input{
      flex:1;
      padding:10px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .input-area button{
      margin-left:10px;
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    .input-area button:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    Gemini Free Chatbot
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>

const API_KEY = "AIzaSyB1MeT1WfXzp5zOZZVYKc-oV2vdMxqaRus";

// FREE MODEL
const MODEL = "gemini-1.5-flash";

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");

function addMessage(text, sender){

  const div = document.createElement("div");

  div.className = `message ${sender}`;

  div.innerText = text;

  chatBox.appendChild(div);

  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

  const text = userInput.value.trim();

  if(!text) return;

  addMessage(text, "user");

  userInput.value = "";

  const loading = document.createElement("div");

  loading.className = "message bot";

  loading.innerText = "Typing...";

  chatBox.appendChild(loading);

  try{

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          contents:[
            {
              parts:[
                {
                  text:text
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    loading.remove();

    if(!response.ok){

      addMessage(
        data.error?.message || "API Error",
        "bot"
      );

      return;
    }

    const reply =
      data.candidates?.[0]?.content?.parts?.[0]?.text ||
      "No response";

    addMessage(reply, "bot");

  }catch(error){

    loading.remove();

    addMessage("Error: " + error.message, "bot");
  }
}

userInput.addEventListener("keypress", function(e){

  if(e.key === "Enter"){

    sendMessage();
  }
});

</script>

</body>
</html>
