<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New OpenRouter Free Chat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .header { background: #1b5e20; color: white; padding: 15px; text-align: center; font-weight: bold; border-radius: 12px 12px 0 0; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 14px; }
        .user { align-self: flex-end; background: #e8f5e9; color: #1b5e20; }
        .bot { align-self: flex-start; background: #f1f1f1; color: #333; }
        .input-area { border-top: 1px solid #eee; padding: 15px; display: flex; gap: 8px; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 25px; outline: none; }
        button { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">OpenRouter AI</div>
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type here...">
        <button onclick="handleSend()">Send</button>
    </div>
</div>

<script>
    // --- CONFIGURATION START ---
    const OPENROUTER_API_KEY = "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"; 
    const MODEL_ID = "inclusionai/ring-2.6-1t:free"; // Use any model with ":free" suffix
    // --- CONFIGURATION END ---

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": MODEL_ID,
                    "messages": [{ "role": "user", "content": text }]
                })
            });

            const data = await response.json();
            const botMessage = data.choices[0].message.content;
            addMessage(botMessage, 'bot');
        } catch (error) {
            addMessage("Error: Check console or API key.", 'bot');
            console.error(error);
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleSend(); });
</script>

</body>
</html>
